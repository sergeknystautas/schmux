# Flight monitor classifier definitions.
#
# Part of the flight workflow, built into schmux. Every installation asks
# these questions; nothing is read from or written to ~/.schmux.
#
# The planner and executor roles are both required, and each needs at least
# one classifier. A classifier is one Choice question sent to Jev alongside
# the completed response of a session in that role. The engine supports
# Choice questions and `notify_on` filtering only. While a flight executes,
# every executor and planner turn wakes the pilot regardless of `notify_on`.

model: jev-latest

roles:
  planner:
    classifiers:
      - id: attention
        question: >-
          Does this planner response ask for an answer or decision, report
          a blocker or failure, or otherwise require intervention?
        choices:
          - id: needs_attention
            description: A question, decision, blocker, or failure needs attention.
          - id: routine
            description: Progress or explanation that needs no intervention.
        notify_on: [needs_attention]
        min_confidence: 0.7

      - id: planning_artifacts
        question: >-
          Which planning documents does this response explicitly claim are
          written or ready for review? Intent to write them later is not enough.
        choices:
          - id: spec
            description: The specification only.
          - id: plan
            description: The implementation plan only.
          - id: both
            description: Both the specification and implementation plan.
          - id: neither
            description: Neither document is claimed to be written or ready.
        notify_on: [spec, plan, both]
        min_confidence: 0.7

      - id: work_check
        question: >-
          Does this planner response, checking work another agent implemented,
          say the work matches the spec and plan, report problems, or is it not
          a check of implemented work?
        choices:
          - id: matches
            description: The work matches the spec and plan.
          - id: problems
            description: The work has problems or does not match the spec and plan.
          - id: not_a_check
            description: This response is not a check of implemented work.
        notify_on: []
        min_confidence: 0

  executor:
    classifiers:
      - id: attention
        question: >-
          Does this executor response ask for an answer or decision, report
          a blocker or failure, or otherwise require intervention?
        choices:
          - id: needs_attention
            description: A question, decision, blocker, or failure needs attention.
          - id: routine
            description: Progress or explanation that needs no intervention.
        notify_on: [needs_attention]
        min_confidence: 0.7

      - id: execution_state
        question: >-
          Does this executor response say the plan is fully implemented, that
          it stopped on a question or blocker, or that work continues?
        choices:
          - id: finished
            description: The plan is fully implemented.
          - id: stopped
            description: The executor stopped on a question or blocker.
          - id: working
            description: Work continues.
        notify_on: []
        min_confidence: 0
